<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warriors Game Recaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,700;1,800&family=Barlow:wght@400;500;600&family=Jost:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
/* VOICE school sports news: proud, upbeat, respectful
   IDEA the Warriors' own brand kit: slanted athletic lettering, maroon with gold keylines
   PICTURE a broadcast-style scoreboard with both team logos
   COLOUR white ground, MCHS maroon #5d2e2f, gold #c1a675 keylines and accents
   TYPE Barlow Condensed italic for headlines and numbers, slanted Futura Bold for the Athletics lockup, Barlow body
   LAYOUT logo masthead, headline, scoreboard, story beside a stat rail; phone stacks */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#171012);--ink:light-dark(#1f1515,#f2ebe6);--soft:light-dark(#6b5a58,#bfaea9);--line:light-dark(#ece2de,#3a2a2c);--panel:light-dark(#faf6f4,#211719);--maroon:#5d2e2f;--deep:#3f1d1e;--gold:#c1a675;--accent:light-dark(#5d2e2f,#d9c08e);--bar:light-dark(#5d2e2f,#c1a675);--opp:light-dark(#a99b98,#6b5a5c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.65 Barlow,system-ui,sans-serif;overflow-x:clip}
img{max-width:100%}
.band{padding-left:max(5vw,16px);padding-right:max(5vw,16px)}
.wrap{max-width:1180px;margin:0 auto}
.fut{font-family:Futura,"Futura PT",Jost,sans-serif;font-style:italic;font-weight:700;text-transform:uppercase;display:inline-block;transform:skewX(-4deg)}
.mast{background:var(--maroon);border-bottom:4px solid var(--gold);box-shadow:0 4px 0 var(--deep)}
.mast .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.brand .hm{height:60px;width:auto}
.brand .lk{height:54px;width:auto}
.lockup{display:grid;justify-items:center;gap:3px}
.lockup img{height:30px;width:auto}
.lockup .fut{color:var(--gold);font-size:16px;letter-spacing:.34em;margin-right:-.34em;line-height:1;transform:translateX(-5px) skewX(-4deg)}
.head{padding-block:clamp(26px,4vw,44px) 22px}
.team{display:inline-block;background:var(--maroon);color:#fff;font-size:15px;padding:5px 16px 4px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);margin-bottom:14px}
.cap{font:italic 800 1em/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.05em}
h1{font:italic 800 clamp(38px,5.2vw,60px)/1.02 "Barlow Condensed",Impact,sans-serif;margin:0 0 14px;text-wrap:balance;max-width:28ch}
.dek{font-size:clamp(18px,2vw,21px);line-height:1.45;color:var(--soft);margin:0;max-width:60ch}
.board{position:relative;overflow:hidden;background:linear-gradient(170deg,#6a3536,var(--maroon) 40%,var(--deep));color:#fff;border-radius:6px;padding:clamp(18px,3vw,30px);box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 0 7px var(--maroon)}
.board>*{position:relative}
.wm{position:absolute!important;right:-40px;top:-40px;height:160%;opacity:.06;pointer-events:none}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.final{background:var(--gold);color:var(--deep);font-size:20px;padding:4px 18px 3px;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%)}

.bdate{color:#e5d2bd;font-size:15px}
.ls{width:100%;border-collapse:collapse;font-family:"Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.ls th{font:italic 700 16px/1 "Barlow Condensed",sans-serif;color:var(--gold);text-align:center;padding:8px 6px;border-bottom:2px solid #c1a67555}
.ls th:first-child{text-align:left}
.ls td{padding:12px 6px;text-align:center;font-size:clamp(20px,3vw,30px);font-weight:600;color:#f1e6da;border-bottom:1px solid #ffffff1a}
.ls tr:last-child td{border-bottom:0}
.ls td.nm{text-align:left;font:italic 800 clamp(24px,3.8vw,40px)/1 "Barlow Condensed",sans-serif;color:#fff;white-space:nowrap}
.ls td.nm small{display:block;font:500 15px/1.3 Barlow,sans-serif;color:#d9c3ad;margin-top:4px}
.nmw{display:flex;align-items:center;gap:clamp(10px,1.6vw,16px)}
.lg{flex:none;width:clamp(56px,7.5vw,88px);height:clamp(42px,5.6vw,64px);object-fit:contain}
.ini{display:grid;place-items:center;border-radius:50%;background:var(--c,#7d6f6d);color:#fff;font:800 clamp(16px,2.2vw,22px)/1 "Barlow Condensed",sans-serif;box-shadow:inset 0 0 0 2px #ffffff55}
.lg.ini{width:clamp(42px,5.6vw,64px);margin-inline:calc((clamp(56px,7.5vw,88px) - clamp(42px,5.6vw,64px))/2)}
.ls td.tot{width:1%;padding-left:clamp(10px,3vw,28px)}
.tbox{display:inline-block;min-width:1.9em;padding:2px .2em 0;font:italic 800 clamp(40px,7vw,80px)/1 "Barlow Condensed",sans-serif;text-align:center;background:#00000033;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%)}
.win .tbox{background:var(--gold);color:var(--deep)}
.lose .tbox{color:#e5d2bd}
.body{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);padding-block:clamp(28px,4vw,48px)}
.sec{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-size:24px;color:var(--accent);line-height:1}
.sec::after{content:"";flex:1;height:3px;background:linear-gradient(90deg,var(--gold),transparent)}
.byline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--soft);padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.byline b{color:var(--ink);font-weight:600}
.story p{margin:0 0 1em;max-width:64ch}
.story p.lede{font-size:21px;line-height:1.55;font-weight:500}
.next{margin-top:26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--maroon);color:#fff;padding:18px 22px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--gold)}
.next .cap{color:var(--gold);font-size:22px}
.next p{margin:0;font:italic 800 26px/1.1 "Barlow Condensed",sans-serif}
.rail{display:grid;gap:30px;align-content:start}
.bx{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.bx th{font:italic 700 15px/1 "Barlow Condensed",sans-serif;color:var(--soft);text-align:right;padding:0 0 8px;border-bottom:2px solid var(--maroon)}
.bx th:first-child{text-align:left}
.bx td{padding:10px 0;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.bx td:first-child{text-align:left;white-space:normal}
.bx td b{display:block;font-weight:600;line-height:1.25}
.bx td span{font-size:14px;color:var(--soft)}
.bx .pt{font:italic 800 30px/1 "Barlow Condensed",sans-serif;color:var(--accent);padding-left:12px}
.bx .tp{font-size:16px;color:var(--soft);padding-left:12px}
.cmp-h{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin-bottom:6px}
.cmp-h img{height:34px;width:48px;object-fit:contain}
.cmp-h .ini{width:34px;height:34px;margin:0 7px;font-size:14px}
.cmp-h span{font:italic 700 15px/1 "Barlow Condensed",sans-serif;color:var(--soft);text-align:center}
.cmp{padding:12px 0;border-top:1px solid var(--line)}
.cmp .lb{text-align:center;font:italic 700 17px/1 "Barlow Condensed",sans-serif;margin-bottom:8px}
.cmp .rw{display:grid;grid-template-columns:4.2em minmax(0,1fr) minmax(0,1fr) 4.2em;align-items:center;gap:6px}
.cmp .pc{font:italic 800 26px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.cmp .pc small{display:block;font:500 13px/1.3 Barlow,sans-serif;color:var(--soft)}
.cmp .pc.l{text-align:left;color:var(--accent)}
.cmp .pc.r{text-align:right;color:var(--soft)}
.cmp .tr{height:14px;background:var(--line);display:flex}
.cmp .tr.l{justify-content:flex-end;clip-path:polygon(6px 0,100% 0,100% 100%,0 100%)}
.cmp .tr.r{clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.cmp .fl{height:100%}
.cmp .tr.l .fl{background:var(--bar)}
.cmp .tr.r .fl{background:var(--opp)}
.cmp .pc.r .best{color:var(--ink)}
.cmp .best::after{content:"";display:block;height:3px;width:1.6em;background:var(--gold);margin-top:3px}
.cmp .pc.r .best::after{margin-left:auto}
.cmp .best{display:inline-block}
.more{border-top:1px solid var(--line);padding-block:clamp(24px,4vw,40px)}
.list{list-style:none;margin:0;padding:0}
.list a{display:grid;grid-template-columns:7em minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);min-height:44px}
.list a:hover b,.list a:focus-visible b{color:var(--accent);text-decoration:underline}
.list span{font-size:14px;color:var(--soft)}
.list em{font:italic 800 22px/1 "Barlow Condensed",sans-serif;white-space:nowrap}
footer{background:var(--maroon);color:#ead9c4;font-size:14px;padding-block:20px;border-top:4px solid var(--gold)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
footer img{height:36px;width:auto}
footer a{color:#fff}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media(max-width:860px){.body{grid-template-columns:minmax(0,1fr)}.rail{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}}
@media(max-width:600px){.lockup{display:none}.brand .hm{height:48px}.brand .lk{height:42px}.ls th,.ls td{padding:8px 3px}.ls td.nm small{font-size:13px}.tbox{min-width:1.7em}.list a{grid-template-columns:minmax(0,1fr) auto}.list a span:first-child{grid-column:1/-1;margin-bottom:-10px}}
@media(prefers-reduced-motion:no-preference){.board{animation:rise .5s ease-out}@keyframes rise{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<header class="mast band"><div class="wrap">
  <a class="brand" href="#" aria-label="Morris Warriors game recaps"><img class="hm" src="assets/helmet.png" alt=""><img class="lk" src="assets/morris-warriors-logo.png" alt="Morris Warriors"></a>
  <div class="lockup"><img src="assets/warriors-wordmark.png" alt="Warriors"><span class="fut">Athletics</span></div>
</div></header>
<main id="app"></main>
<footer class="band"><div class="wrap"><span>Morris Community High School · Morris, IL · Follow <a href="https://x.com/morris_sports1">@morris_sports1</a></span><img src="assets/warriors-wordmark.png" alt="Warriors"></div></footer>
<script>
{
/* ---- Games: newest first. Add a new object to the top for each recap. ---- */
const GAMES = [
  {
    id: "bbb-southland-prep-112326",
    team: "Boys varsity basketball",
    date: "2026-11-23",
    headline: "Warriors Hit 7 Threes but Fall to Southland Prep, 73-44",
    dek: "Brycen Johnson scored 20 and Cade Osborne added 13 as Morris shot 7-of-12 from beyond the arc.",
    morris: { name: "Morris", sub: "Warriors", logo: "assets/helmet.png", record: "0-1", periods: [15, 7, 18, 4] },
    opp: { name: "Southland Prep", short: "Southland", abbr: "SCP", sub: "Eagles", logo: "assets/logos/southland-prep.png", record: "", periods: [18, 24, 26, 5] },
    periodLabel: "Q",
    story: [
      "The Morris Warriors hung with Southland Prep early on Monday night but couldn't keep pace after the first quarter, falling 73-44.",
      "Morris trailed just 18-15 after one before the Eagles outscored the Warriors 24-7 in the second quarter to take a 42-22 lead into halftime. Southland Prep kept pulling away and led 68-40 after three. Eagles standout Tristan Garner led all scorers with 35 points.",
      "The Warriors were sharp from beyond the arc, knocking down 7 of 12 three-point attempts (58%). Brycen Johnson led Morris with 20 points, including 3-of-6 shooting from deep, and Cade Osborne added 13.",
      "There was a bright spot for the future, too: sophomores Broderick, Peterson and Harrison all scored their first varsity points, with Harrison chipping in 6.",
      "Morris (0-1) is back on the court Tuesday, Nov. 24, against Comer."
    ],
    leaders: [
      { name: "Brycen Johnson", note: "", pts: 20, tp: "3-6" },
      { name: "Cade Osborne", note: "", pts: 13, tp: "" },
      { name: "Harrison", note: "Sophomore, first varsity points", pts: 6, tp: "" }
    ],
    shooting: [
      { label: "Field goals", m: [14, 30], o: [28, 50] },
      { label: "Three-pointers", m: [7, 12], o: [10, 23] },
      { label: "Free throws", m: [9, 16], o: [7, 11] }
    ],
    next: "Comer, Tuesday, Nov. 24",
    source: "@MCHSBkBall"
  }
];

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sum = a => a.reduce((x, y) => x + y, 0);
const fmtDate = (d, long) => new Date(d + "T12:00:00").toLocaleDateString("en-US", long ? { weekday: "long", month: "long", day: "numeric", year: "numeric" } : { month: "short", day: "numeric" });
const pct = ([a, b]) => b ? Math.round(a / b * 100) : 0;
const app = document.getElementById("app");

function badge(t, cls) {
  const c = cls === undefined ? "lg" : cls;
  if (t.logo) return `<img class="${c}" src="${esc(t.logo)}" alt="">`;
  const ini = (t.abbr || t.name.split(/\s+/).map(w => w[0]).join("").slice(0, 3)).toUpperCase();
  return `<span class="${c} ini" style="--c:${esc(t.color || "#7d6f6d")}">${esc(ini)}</span>`;
}
function row(t, total, win) {
  const sub = [t.sub, t.record ? "(" + t.record + ")" : ""].filter(Boolean).join(" ");
  return `<tr class="${win ? "win" : "lose"}"><td class="nm"><div class="nmw">${badge(t)}<div>${esc(t.short || t.name)}<small>${esc(sub)}</small></div></div></td>${t.periods.map(p => `<td>${esc(p)}</td>`).join("")}<td class="tot"><span class="tbox">${esc(total)}</span></td></tr>`;
}
function cmp(s) {
  const a = pct(s.m), b = pct(s.o);
  return `<div class="cmp"><div class="lb">${esc(s.label)}</div><div class="rw">
    <div class="pc l"><span class="${a > b ? "best" : ""}">${a}%</span><small>${esc(s.m[0] + "-" + s.m[1])}</small></div>
    <div class="tr l"><div class="fl" style="width:${a}%"></div></div>
    <div class="tr r"><div class="fl" style="width:${b}%"></div></div>
    <div class="pc r"><span class="${b > a ? "best" : ""}">${b}%</span><small>${esc(s.o[0] + "-" + s.o[1])}</small></div></div></div>`;
}

function render() {
  const id = decodeURIComponent(location.hash.slice(1));
  const g = GAMES.find(x => x.id === id) || GAMES[0];
  const mT = sum(g.morris.periods), oT = sum(g.opp.periods);
  const heads = g.morris.periods.map((_, i) => `<th scope="col">${i < 4 ? esc(g.periodLabel + (i + 1)) : "OT" + (i > 4 ? i - 3 : "")}</th>`).join("");
  const others = GAMES.filter(x => x !== g);
  const tp = g.leaders.some(l => l.tp);
  document.title = g.headline;
  app.innerHTML = `
  <section class="band head"><div class="wrap">
    <div class="team"><span class="cap">${esc(g.team)}</span></div>
    <h1>${esc(g.headline)}</h1>
    <p class="dek">${esc(g.dek)}</p>
  </div></section>
  <section class="band"><div class="wrap">
    <div class="board" role="group" aria-label="Final score"><img class="wm" src="assets/helmet-white.png" alt="">
      <div class="bhead"><span class="final"><span class="cap">Final</span></span><span class="bdate">${esc(fmtDate(g.date, true))}</span></div>
      <table class="ls"><thead><tr><th scope="col">Team</th>${heads}<th scope="col">Final</th></tr></thead>
      <tbody>${row(g.opp, oT, oT > mT)}${row(g.morris, mT, mT > oT)}</tbody></table>
    </div>
  </div></section>
  <section class="band"><div class="wrap body">
    <article class="story">
      <h2 class="sec"><span class="cap">Game story</span></h2>
      <div class="byline"><span><b>Morris Warriors Sports</b></span><span>Stats via ${esc(g.source)}</span></div>
      ${g.story.map((p, i) => `<p${i ? "" : ' class="lede"'}>${esc(p)}</p>`).join("")}
      ${g.next ? `<div class="next"><span class="cap">Up next</span><p>${esc(g.next)}</p></div>` : ""}
    </article>
    <aside class="rail">
      <section><h2 class="sec"><span class="cap">Warriors leaders</span></h2>
        <table class="bx"><thead><tr><th scope="col">Player</th>${tp ? '<th scope="col">3PT</th>' : ""}<th scope="col">PTS</th></tr></thead><tbody>
        ${g.leaders.map(l => `<tr><td><b>${esc(l.name)}</b>${l.note ? `<span>${esc(l.note)}</span>` : ""}</td>${tp ? `<td class="tp">${esc(l.tp || "–")}</td>` : ""}<td class="pt">${esc(l.pts)}</td></tr>`).join("")}
        </tbody></table></section>
      <section><h2 class="sec"><span class="cap">Team shooting</span></h2>
        <div class="cmp-h">${badge(g.morris, "")}<span>Morris vs. ${esc(g.opp.short || g.opp.name)}</span>${badge(g.opp, "")}</div>
        ${g.shooting.map(cmp).join("")}
      </section>
    </aside>
  </div></section>
  ${others.length ? `<section class="band more"><div class="wrap"><h2 class="sec"><span class="cap">More recaps</span></h2><ul class="list">${others.map(x => {
    const a = sum(x.morris.periods), b = sum(x.opp.periods);
    return `<li><a href="#${esc(x.id)}"><span>${esc(fmtDate(x.date))} · ${esc(x.team)}</span><b>${esc(x.headline)}</b><em>${a > b ? "W" : a < b ? "L" : "T"} ${esc(a)}-${esc(b)}</em></a></li>`;
  }).join("")}</ul></div></section>` : ""}`;
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
render();
}
</script>
</body>
</html>
